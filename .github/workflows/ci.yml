# CI for pull requests and pushes to main: installs the package and runs the
# full unittest suite on a matrix of Python versions. The opt-in live-server
# integration tests skip themselves when INVOICE_NINJA_RUN_INTEGRATION is unset.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is EOL and no longer available on current Ubuntu runners.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . requests coverage

      - name: Run tests
        run: python -m unittest -v

      - name: Coverage (informational)
        run: |
          coverage run -m unittest
          coverage report

  build-check:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist-check
          path: dist/
